<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mg sound</title>
    <link rel="stylesheet" href="teamg.css">
  </head>
  <body>
    <main class="crt-shell">
      <div class="signal-line" aria-hidden="true"></div>
      <header class="topbar">
        <a class="tiny-link" href="/mg-sound-statistics">MG Sound Statistics</a>
        <div class="live-chip"><span></span> Live goal</div>
      </header>

      <section class="crt-screen" aria-label="Цель подписчиков mg sound">
        <img id="avatar" class="logo" alt="mg sound logo">
        <div class="copy">
          <p class="handle">@mg_sound1</p>
          <h1 class="glitch-title" aria-label="mg sound">
            <span aria-hidden="true" data-text="mg sound">mg sound</span>
          </h1>
          <p class="subtitle">первый километр до 1 000 подписчиков</p>
        </div>

        <div class="counter">
          <span id="followersNow">0</span>
          <span class="arrow">→</span>
          <span>1 000</span>
        </div>

        <div class="meter-wrap">
          <div class="meter-labels">
            <span id="goalPercent">0%</span>
            <span id="goalRemaining">осталось 1 000</span>
          </div>
          <div class="meter">
            <div id="goalFill" class="fill"></div>
            <div id="goalGhost" class="ghost-fill"></div>
            <div id="goalNeedle" class="needle"></div>
          </div>
          <div class="ticks" aria-hidden="true">
            <span>0</span>
            <span>250</span>
            <span>500</span>
            <span>750</span>
            <span>1000</span>
          </div>
        </div>

        <a class="follow-button" href="https://www.tiktok.com/@mg_sound1" target="_blank" rel="noreferrer">
          Подписаться и сдвинуть линию
        </a>
      </section>

      <footer class="status">
        <span id="status">синхронизация...</span>
        <span id="erValue">ER --</span>
      </footer>
    </main>

    <script src="teamg.js"></script>
  </body>
</html>
